<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSC Online Diary v2</title>
    <link rel="stylesheet" href="stylesV2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imprima&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">
                <h1>RSC Online Diary</h1>
            </div>

            <div class="nav-bar">
            <div class="nav-headings">
                <ul>
                    <li><a href="indexV2.html">Home</a></li>
                    <li><a href="vaultV2.html">Vault</a></li>
                    <li><a href="new-entryV2.html">JOURNAL</a></li>            
                    <li class="empty-space"></li>
                </ul>
            </div>
        </div>

            <div class="user-actions">
                <i class="fa-solid fa-image-portrait" id="photo"></i>
                <button class="btn btn-primary" id="newEntryBtn">
                    <i class="fas fa-plus"></i> New Entry
                </button>
            </div>
        </header>

        <div class="app-container">
             

            <div class="sidebar">
                <h1 style="text-align: right;">DEPTH INSIGHT</h1><br>
                <p style="text-align: right;">Write without judgement. The vellum remembers only what you choose to ink.</p><br><br>
                <div class="journal-list" id="journalList">
                
                    <!-- Journal entries will be populated here -->
                </div>
            </div>

            <div class="main-content">

                <div id="journalEditor">
                    <div class="journal-header">
                        <div style="width: 100%;">
                            <input type="text" class="journal-title" placeholder="Untitled Reflection" id="journalTitle">
                            <div class="journal-meta">
                                <span id="journalDate"></span>
                                <span id="journalTime"></span>
                            </div>
                        </div>
                        <div class="user-actions">
                            <button class="btn btn-secondary" id="saveBtn">
                                <i class="fas fa-save"></i> Save
                            </button>
                            <button class="btn btn-danger" id="deleteBtn">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>

                    <div class="mood-selector">
                        <div class="mood-btn active" data-mood="happy" title="happy">😊</div>
                        <div class="mood-btn" data-mood="neutral" title="neutral">😐</div>
                        <div class="mood-btn" data-mood="sad" title="sad">😔</div>
                        <div class="mood-btn" data-mood="excited" title="excited">😄</div>
                        <div class="mood-btn" data-mood="tired" title="tired">😴</div>
                    </div>

                    <textarea class="journal-content" placeholder="Begin your reflection...." id="journalContent"></textarea>

                </div>

                
            </div>
        </div>
    </div>


    <footer>
        <div class="footer-left">
            <p>&#169 2026 RSC Online Diary Application. All rights reserved.</p>
        </div>

        <div class="footer-right">
            <ul class="footer-links">
                <li>Privacy</li>
                <li>Terms</li>
                <li>Archive</li>
            </ul>
        </div>
    </footer>
    
    <script src="script-new-entry-V2.js"></script>
</body>
</html>
